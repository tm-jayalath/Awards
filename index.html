<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanka Chairman's Champions Awards Night 2026</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="banner">
    <div class="banner-row">
      <img src="assets/logoo.png" alt="logo">
      <h1>Lanka Chairman's Champions Awards Night 2026</h1>
    </div>
    <p>Please complete the application below to participate in this prestigious awards program.</p>
  </div>

  <div class="form-box">

    <label>Full Name</label>
    <input id="fullName" placeholder="Please type full name">

    <label>Address</label>
    <input id="address" placeholder="Enter address">

    <label>Mobile Number (WhatsApp)</label>
    <div class="phone-group">
      <select id="countryCode">
        <option value="+94" selected>🇱🇰 Sri Lanka (+94)</option>
        <option value="+91">🇮🇳 India (+91)</option>
        <option value="+1">🇺🇸 United States (+1)</option>
        <option value="+44">🇬🇧 United Kingdom (+44)</option>
        <option value="+61">🇦🇺 Australia (+61)</option>
        <option value="+971">🇦🇪 UAE (+971)</option>
        <option value="+966">🇸🇦 Saudi Arabia (+966)</option>
        <option value="+65">🇸🇬 Singapore (+65)</option>
        <option value="+81">🇯🇵 Japan (+81)</option>
        <option value="+49">🇩🇪 Germany (+49)</option>
        <option value="+33">🇫🇷 France (+33)</option>
        <option value="+39">🇮🇹 Italy (+39)</option>
        <option value="+7">🇷🇺 Russia (+7)</option>
        <option value="+86">🇨🇳 China (+86)</option>
        <option value="+27">🇿🇦 South Africa (+27)</option>
        <option value="+55">🇧🇷 Brazil (+55)</option>
        <option value="+234">🇳🇬 Nigeria (+234)</option>
        <option value="+351">🇵🇹 Portugal (+351)</option>
        <option value="+34">🇪🇸 Spain (+34)</option>
        <option value="+41">🇨🇭 Switzerland (+41)</option>
      </select>
      <input id="mobile" placeholder="Enter mobile number">
    </div>

    <label>Email</label>
    <input id="email" placeholder="example@email.com">

    <label>Award Category</label>
    <select id="category" onchange="toggleSections()">
      <option value="">Select category</option>
      <option value="plantation">Plantation Sector</option>
      <option value="sales">Sales Achiever</option>
      <option value="other">Other</option>
    </select>

    <div id="plantation" class="conditional">
      <label>Plantation Company Name</label>
      <input id="plantationCompany" placeholder="Enter company name">
    </div>

    <div id="sales" class="conditional">
      <label>Company Name</label>
      <input id="salesCompany" placeholder="Insurance or relevant company">
    </div>

    <div id="other" class="conditional">
      <label>Type</label>
      <select id="otherType">
        <option>Own Company</option>
        <option>Other</option>
      </select>
      <label>Company Name</label>
      <input id="otherCompany" placeholder="Enter company name">
    </div>

    <label>Comments</label>
    <textarea id="comments" rows="4" placeholder="Optional"></textarea>

    <button type="button" onclick="submitForm()">Submit Application</button>

    <div id="successMsg" class="success-msg"></div>
    <div id="contactMsg" class="contact-msg"></div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
